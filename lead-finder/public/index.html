<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Finder — Medianet Gang</title>
<style>
  :root {
    --bg: #0e0e0e;
    --surface: #161616;
    --surface2: #1f1f1f;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --text: #f0f0f0;
    --muted: #666;
    --muted2: #444;
    --red: #ff4d4d;
    --orange: #ff9500;
    --green: #4dff91;
    --radius: 10px;
    --radius-sm: 6px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'Courier New', monospace; min-height: 100vh; }

  header {
    padding: 1.5rem 2rem;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .logo { font-size: 11px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; }
  .logo span { color: var(--accent); }

  .main { padding: 2rem; max-width: 960px; margin: 0 auto; }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 4px; }
  h1 span { color: var(--accent); }
  .subtitle { font-size: 13px; color: var(--muted); margin-bottom: 2rem; font-family: sans-serif; }

  .config-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 1.5rem;
    margin-bottom: 1.5rem;
  }
  .config-panel h2 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); margin-bottom: 1rem; }
  .fields { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1/-1; }
  label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  input, select {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    color: var(--text);
    font-family: 'Courier New', monospace;
    font-size: 13px;
    padding: 10px 12px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus, select:focus { border-color: var(--accent); }
  select option { background: #1f1f1f; }

  .btn-row { display: flex; gap: 10px; margin-top: 1.5rem; }
  button {
    font-family: 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 10px 20px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    border: 1px solid transparent;
    transition: all 0.15s;
  }
  .btn-primary { background: var(--accent); color: #0e0e0e; font-weight: 700; border-color: var(--accent); }
  .btn-primary:hover { background: #d4e840; }
  .btn-primary:disabled { background: var(--muted2); color: var(--muted); border-color: var(--muted2); cursor: not-allowed; }
  .btn-secondary { background: transparent; color: var(--muted); border-color: var(--border); }
  .btn-secondary:hover { color: var(--text); border-color: var(--muted); }

  .status-bar {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1rem 1.5rem;
    margin-bottom: 1.5rem; display: none; align-items: center; gap: 12px;
  }
  .status-bar.visible { display: flex; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid var(--border);
    border-top-color: var(--accent); border-radius: 50%;
    animation: spin 0.7s linear infinite; flex-shrink: 0;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .status-text { font-size: 12px; color: var(--muted); }
  .status-count { font-size: 12px; color: var(--accent); margin-left: auto; }

  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .results-header h2 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }

  .filters { display: flex; gap: 8px; margin-bottom: 1rem; flex-wrap: wrap; }
  .filter-btn {
    font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase;
    padding: 5px 12px; border-radius: 99px;
    background: transparent; color: var(--muted); border: 1px solid var(--border);
  }
  .filter-btn.active { background: rgba(232,255,71,0.12); color: var(--accent); border-color: var(--accent); }

  .leads-grid { display: flex; flex-direction: column; gap: 8px; }

  .lead-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 1.25rem 1.5rem;
    transition: border-color 0.15s;
  }
  .lead-card:hover { border-color: var(--muted2); }
  .lead-card.no-site { border-left: 3px solid var(--red); }
  .lead-card.old-site { border-left: 3px solid var(--orange); }
  .lead-card.ok-site { border-left: 3px solid var(--green); }

  .lead-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .lead-name { font-size: 15px; font-weight: 700; }
  .lead-category { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 3px; font-family: sans-serif; }

  .badge { font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; padding: 4px 10px; border-radius: 99px; flex-shrink: 0; font-weight: 700; }
  .badge-red { background: rgba(255,77,77,0.12); color: var(--red); border: 1px solid rgba(255,77,77,0.25); }
  .badge-orange { background: rgba(255,149,0,0.12); color: var(--orange); border: 1px solid rgba(255,149,0,0.25); }
  .badge-green { background: rgba(77,255,145,0.12); color: var(--green); border: 1px solid rgba(77,255,145,0.25); }

  .lead-meta { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .meta-item { font-size: 12px; color: var(--muted); font-family: sans-serif; display: flex; align-items: center; gap: 5px; }
  .meta-item .val { color: var(--text); }
  .stars { color: var(--orange); font-size: 12px; }

  .lead-address { font-size: 12px; color: var(--muted); font-family: sans-serif; }
  .lead-footer {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--border);
  }
  .site-url { font-size: 11px; color: var(--muted); font-family: 'Courier New', monospace; }
  .site-url a { color: var(--accent); text-decoration: none; }
  .site-url a:hover { text-decoration: underline; }

  .score-bar { display: flex; gap: 3px; align-items: center; }
  .score-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted2); }
  .score-dot.lit-red { background: var(--red); }
  .score-dot.lit-orange { background: var(--orange); }
  .score-dot.lit-green { background: var(--accent); }
  .score-label { font-size: 10px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; margin-right: 6px; }

  .error-msg {
    background: rgba(255,77,77,0.08); border: 1px solid rgba(255,77,77,0.2);
    border-radius: var(--radius); padding: 1rem 1.5rem;
    font-size: 13px; color: var(--red); font-family: sans-serif;
    margin-bottom: 1.5rem; display: none;
  }
  .error-msg.visible { display: block; }

  .export-row { display: flex; gap: 8px; margin-top: 1rem; }

  .no-results { text-align: center; padding: 4rem 2rem; color: var(--muted); font-family: sans-serif; }

  @media (max-width: 600px) {
    .fields { grid-template-columns: 1fr; }
    .main { padding: 1rem; }
  }
</style>
</head>
<body>

<header>
  <div class="logo"><span>Medianet Gang</span> · Lead Finder</div>
  <div style="font-size:11px;color:var(--muted);">v1.0</div>
</header>

<div class="main">
  <h1>Business <span>senza web</span></h1>
  <p class="subtitle">Trova attività locali senza sito o con sito obsoleto — potenziali clienti per la tua agenzia.</p>

  <div class="config-panel">
    <h2>⚙ Configurazione ricerca</h2>
    <div class="fields">
      <div class="field">
        <label>Categoria / Tipo di business</label>
        <select id="category">
          <option value="restaurant">Ristoranti</option>
          <option value="bar">Bar & Caffetterie</option>
          <option value="beauty_salon">Centri Estetici</option>
          <option value="hair_care">Parrucchieri</option>
          <option value="clothing_store">Negozi Abbigliamento</option>
          <option value="shoe_store">Negozi Scarpe</option>
          <option value="gym">Palestre & Fitness</option>
          <option value="dentist">Dentisti</option>
          <option value="lawyer">Studi Legali</option>
          <option value="real_estate_agency">Agenzie Immobiliari</option>
          <option value="car_repair">Autofficine</option>
          <option value="florist">Fioristi</option>
          <option value="bakery">Panetterie & Pasticcerie</option>
          <option value="night_club">Locali Notturni</option>
          <option value="travel_agency">Agenzie di Viaggio</option>
          <option value="accounting">Commercialisti</option>
          <option value="veterinary_care">Veterinari</option>
          <option value="store">Negozi Generici</option>
        </select>
      </div>
      <div class="field">
        <label>Zona / Città</label>
        <input type="text" id="location" placeholder="es. Bari, Taranto, Bari Vecchia..." value="Bari">
      </div>
      <div class="field">
        <label>Raggio di ricerca</label>
        <select id="radius">
          <option value="500">500 m</option>
          <option value="1000">1 km</option>
          <option value="2000" selected>2 km</option>
          <option value="5000">5 km</option>
          <option value="10000">10 km</option>
          <option value="20000">20 km</option>
        </select>
      </div>
      <div class="field">
        <label>Max risultati</label>
        <select id="maxResults">
          <option value="20">20 business</option>
          <option value="40" selected>40 business</option>
          <option value="60">60 business</option>
        </select>
      </div>
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="searchBtn" onclick="startSearch()">▶ Avvia Ricerca</button>
      <button class="btn-secondary" onclick="clearResults()">✕ Pulisci</button>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>
  <div class="status-bar" id="statusBar">
    <div class="spinner"></div>
    <span class="status-text" id="statusText">Inizializzazione...</span>
    <span class="status-count" id="statusCount"></span>
  </div>

  <div id="resultsSection" style="display:none;">
    <div class="results-header">
      <h2>Risultati</h2>
      <span style="font-size:11px;color:var(--muted);" id="resultsMeta"></span>
    </div>
    <div class="filters">
      <button class="filter-btn active" onclick="setFilter('all',this)">Tutti</button>
      <button class="filter-btn" onclick="setFilter('no-site',this)">🔴 Senza sito</button>
      <button class="filter-btn" onclick="setFilter('old-site',this)">🟠 Sito obsoleto</button>
      <button class="filter-btn" onclick="setFilter('ok-site',this)">🟢 Sito ok</button>
    </div>
    <div class="leads-grid" id="leadsGrid"></div>
    <div class="export-row">
      <button class="btn-secondary" onclick="exportCSV()">⬇ Esporta CSV</button>
      <button class="btn-secondary" onclick="exportJSON()">⬇ Esporta JSON</button>
    </div>
  </div>
</div>

<script>
let allLeads = [];
let currentFilter = 'all';
let searchAborted = false;

// Il proxy Vercel — in locale usa /api/places, in produzione uguale
const PROXY = '/api/places';

function showStatus(text, count) {
  document.getElementById('statusBar').classList.add('visible');
  document.getElementById('statusText').textContent = text;
  if (count !== undefined) document.getElementById('statusCount').textContent = count;
}
function hideStatus() { document.getElementById('statusBar').classList.remove('visible'); }
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.classList.add('visible');
}
function hideError() { document.getElementById('errorMsg').classList.remove('visible'); }

async function apiCall(endpoint, params) {
  const url = `${PROXY}?endpoint=${endpoint}&${new URLSearchParams(params)}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error('Errore server: ' + res.status);
  return res.json();
}

async function startSearch() {
  const location = document.getElementById('location').value.trim();
  const category = document.getElementById('category').value;
  const radius = document.getElementById('radius').value;
  const maxResults = parseInt(document.getElementById('maxResults').value);

  hideError();
  if (!location) { showError('Specifica una zona o città.'); return; }

  document.getElementById('searchBtn').disabled = true;
  document.getElementById('resultsSection').style.display = 'none';
  allLeads = [];
  searchAborted = false;

  try {
    showStatus('Geocodifica posizione: ' + location + '...');
    const geoData = await apiCall('geocode', { address: location });
    if (geoData.status !== 'OK' || !geoData.results.length) throw new Error('Posizione non trovata: ' + location);
    const { lat, lng } = geoData.results[0].geometry.location;

    showStatus('Ricerca business su Google Maps...');
    const placesData = await apiCall('nearbysearch', { location: `${lat},${lng}`, radius, type: category });
    if (placesData.status !== 'OK' && placesData.status !== 'ZERO_RESULTS') {
      throw new Error('Errore Places API: ' + placesData.status + (placesData.error_message ? ' — ' + placesData.error_message : ''));
    }

    let places = placesData.results || [];

    if (placesData.next_page_token) {
      await new Promise(r => setTimeout(r, 2200));
      try {
        const p2 = await apiCall('nearbysearch', { pagetoken: placesData.next_page_token });
        places = places.concat(p2.results || []);
      } catch(e) {}
    }

    if (!places.length) {
      hideStatus();
      showError('Nessun business trovato. Prova a cambiare categoria o zona.');
      document.getElementById('searchBtn').disabled = false;
      return;
    }

    const toProcess = places.slice(0, maxResults);
    document.getElementById('resultsSection').style.display = 'block';
    document.getElementById('leadsGrid').innerHTML = '';

    for (let i = 0; i < toProcess.length; i++) {
      if (searchAborted) break;
      const place = toProcess[i];
      showStatus(`Analisi: ${place.name}`, `${i+1} / ${toProcess.length}`);

      const fields = 'place_id,name,formatted_address,formatted_phone_number,website,rating,user_ratings_total,types';
      const detailData = await apiCall('details', { place_id: place.place_id, fields });
      if (detailData.status !== 'OK') continue;
      const details = detailData.result;

      await new Promise(r => setTimeout(r, 80));

      let webInfo;
      if (!details.website) {
        webInfo = { status: 'no-site', info: 'Nessun sito su Google Maps', score: 0 };
      } else {
        webInfo = analyzeUrl(details.website);
      }

      const lead = {
        id: place.place_id,
        name: details.name,
        address: details.formatted_address || '',
        phone: details.formatted_phone_number || '',
        website: details.website || '',
        rating: details.rating,
        ratingCount: details.user_ratings_total || 0,
        types: (details.types || []).filter(t => !['establishment','point_of_interest'].includes(t)).slice(0,2),
        webStatus: webInfo.status,
        webInfo: webInfo.info,
        webScore: webInfo.score,
        mapsUrl: `https://www.google.com/maps/place/?q=place_id:${place.place_id}`
      };

      allLeads.push(lead);
      renderCard(lead);
      updateMeta();
    }

    hideStatus();

  } catch(err) {
    hideStatus();
    showError('Errore: ' + err.message);
  }

  document.getElementById('searchBtn').disabled = false;
}

function analyzeUrl(url) {
  let score = 8;
  let problems = [];

  if (!url.startsWith('https://')) { problems.push('No SSL'); score -= 2; }

  const domain = url.toLowerCase();
  if (domain.includes('wix.com') || domain.includes('weebly.com') || domain.includes('jimdo.com')) {
    problems.push('Costruttore gratuito (Wix/Weebly)'); score -= 3;
  }
  if (domain.includes('blogspot') || domain.includes('altervista')) {
    problems.push('Piattaforma gratuita datata'); score -= 4;
  }

  score = Math.max(0, Math.min(10, score));

  let status, info;
  if (!url) {
    status = 'no-site'; info = 'Nessun sito';
  } else if (score <= 4) {
    status = 'old-site'; info = problems.join(' · ') || 'Sito da aggiornare';
  } else if (score <= 6) {
    status = 'old-site'; info = problems.join(' · ') || 'Margini di miglioramento';
  } else {
    status = 'ok-site'; info = 'Sito presente';
  }

  return { status, info, score };
}

function clearResults() {
  searchAborted = true;
  allLeads = [];
  document.getElementById('leadsGrid').innerHTML = '';
  document.getElementById('resultsSection').style.display = 'none';
  hideStatus(); hideError();
  document.getElementById('searchBtn').disabled = false;
}

function renderCard(lead) {
  if (currentFilter !== 'all' && lead.webStatus !== currentFilter) return;
  const grid = document.getElementById('leadsGrid');
  const badgeMap = {
    'no-site': ['badge-red', '✕ Nessun sito'],
    'old-site': ['badge-orange', '⚠ Sito obsoleto'],
    'ok-site': ['badge-green', '✓ Sito ok']
  };
  const [badgeClass, badgeLabel] = badgeMap[lead.webStatus];
  const stars = lead.rating ? '★'.repeat(Math.round(lead.rating)) + '☆'.repeat(5-Math.round(lead.rating)) : '';
  const typeLabel = lead.types.map(t => t.replace(/_/g,' ')).join(', ');

  const scoreColor = lead.webScore >= 7 ? 'lit-green' : lead.webScore >= 4 ? 'lit-orange' : 'lit-red';
  const filled = lead.webScore === 0 ? 0 : Math.round((lead.webScore/10)*5);
  const dots = Array.from({length:5},(_,i) => `<div class="score-dot ${i<filled?scoreColor:''}"></div>`).join('');

  const card = document.createElement('div');
  card.className = `lead-card ${lead.webStatus}`;
  card.innerHTML = `
    <div class="lead-top">
      <div>
        <div class="lead-name">${esc(lead.name)}</div>
        ${typeLabel ? `<div class="lead-category">${esc(typeLabel)}</div>` : ''}
      </div>
      <span class="badge ${badgeClass}">${badgeLabel}</span>
    </div>
    <div class="lead-meta">
      ${lead.rating ? `<div class="meta-item"><span class="stars">${stars}</span> <span class="val">${lead.rating.toFixed(1)}</span> <span>(${lead.ratingCount})</span></div>` : ''}
      ${lead.phone ? `<div class="meta-item">📞 <span class="val">${esc(lead.phone)}</span></div>` : ''}
    </div>
    ${lead.address ? `<div class="lead-address">📍 ${esc(lead.address)}</div>` : ''}
    <div class="lead-footer">
      <div class="site-url">
        ${lead.website
          ? `🌐 <a href="${esc(lead.website)}" target="_blank">${esc(trunc(lead.website,45))}</a> <span style="color:var(--muted)">· ${esc(lead.webInfo)}</span>`
          : `<span style="color:var(--red)">✕ ${esc(lead.webInfo)}</span>`}
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <a href="${lead.mapsUrl}" target="_blank" style="font-size:11px;color:var(--muted);text-decoration:none;text-transform:uppercase;letter-spacing:0.04em;border:1px solid var(--border);padding:4px 10px;border-radius:99px;">Maps →</a>
        ${lead.website ? `<span class="score-label">web</span><div class="score-bar">${dots}</div>` : ''}
      </div>
    </div>
  `;
  grid.appendChild(card);
}

function updateMeta() {
  const no = allLeads.filter(l => l.webStatus==='no-site').length;
  const old = allLeads.filter(l => l.webStatus==='old-site').length;
  const ok = allLeads.filter(l => l.webStatus==='ok-site').length;
  document.getElementById('resultsMeta').textContent = `${allLeads.length} totali · ${no} senza sito · ${old} obsoleto · ${ok} ok`;
}

function setFilter(filter, btn) {
  currentFilter = filter;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const grid = document.getElementById('leadsGrid');
  grid.innerHTML = '';
  const list = filter==='all' ? allLeads : allLeads.filter(l => l.webStatus===filter);
  if (!list.length) { grid.innerHTML = '<div class="no-results">Nessun risultato per questo filtro.</div>'; return; }
  list.forEach(renderCard);
}

function exportCSV() {
  if (!allLeads.length) return;
  const headers = ['Nome','Indirizzo','Telefono','Sito Web','Status','Note','Rating','Recensioni','Maps URL'];
  const rows = allLeads.map(l => [
    l.name, l.address, l.phone, l.website,
    l.webStatus==='no-site'?'Nessun sito':l.webStatus==='old-site'?'Sito obsoleto':'Sito ok',
    l.webInfo, l.rating||'', l.ratingCount||'', l.mapsUrl
  ]);
  const csv = [headers,...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(',')).join('\n');
  dl('lead-finder.csv', csv, 'text/csv');
}

function exportJSON() {
  if (!allLeads.length) return;
  dl('lead-finder.json', JSON.stringify(allLeads,null,2), 'application/json');
}

function dl(name, content, mime) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([content],{type:mime}));
  a.download = name; a.click();
}

function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function trunc(s,n) { return s.length>n ? s.slice(0,n)+'...' : s; }
</script>
</body>
</html>
